<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница переехала — НАШДОМ</title>
<!-- Статья из старой версии сайта. На новом сайте темы «комбинированные
     дома» нет ни в одном разделе (дренаж, скважина, ливнёвка, доставка) -
     переиздавать её незачем, содержательного преемника у неё нет.
     На этот адрес есть входящая ссылка с ya.ru (Яндекс Нейрум цитирует
     статью как источник), поэтому адрес не должен молча отдавать 404:
     тогда сигнал со ссылки просто терялся бы.

     Настоящий 301 отсюда не поставить: сайт статический, GitHub Pages
     без сервера. Основной редирект настроен на уровне Cloudflare
     (правило Bulk Redirects/Redirect Rules), а эта страница - запасной
     вариант на случай, если правило Cloudflare слетит или домен уйдёт
     с прокси. meta refresh + canonical Google и Яндекс читают как
     эквивалент редиректа при сведении сигналов. -->
<link rel="canonical" href="https://ursdom.ru/">
<meta http-equiv="refresh" content="0; url=https://ursdom.ru/">
<meta name="robots" content="noindex,follow">
</head>
<body>
<p>Страница переехала. Если перенаправление не сработало автоматически,
переходите на <a href="https://ursdom.ru/">главную страницу ursdom.ru</a>.</p>
</body>
</html>
